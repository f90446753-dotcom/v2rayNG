name: Android Build (Universal APK)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'V2rayNG/**'
      - 'compile-hevtun.sh'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '30.0.16248370'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          # Pin ndkVersion inside the android { } block (safe to re-run, safe if lines move)
          F="${{ github.workspace }}/V2rayNG/app/build.gradle.kts"
          if ! grep -q 'ndkVersion' "$F"; then
            sed -i "/namespace = \"com.v2ray.ang\"/a\\    ndkVersion = \"${NDK_VERSION}\"" "$F"
          fi

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Fetch AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "Current tag in this repo: $CURRENT_TAG"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      # If you add the 4 secrets APP_KEYSTORE_BASE64 / APP_KEYSTORE_PASSWORD /
      # APP_KEYSTORE_ALIAS / APP_KEY_PASSWORD, your own permanent key is used
      # (updates install over the old version). Otherwise a one-off key is
      # generated: the APK installs fine, but a new build needs uninstalling
      # the previous one first.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ]; then
            echo "Using keystore from repository secrets"
            printf '%s' "$KS_B64" | base64 -d > "$KS_FILE"
            KS_PASS="$KS_PASS_SECRET"; KS_ALIAS="$KS_ALIAS_SECRET"; KEY_PASS="$KEY_PASS_SECRET"
          else
            echo "No keystore secrets found: generating a one-off key"
            KS_PASS="$(openssl rand -hex 16)"; KEY_PASS="$KS_PASS"; KS_ALIAS="redesign"
            keytool -genkeypair -v -keystore "$KS_FILE" -storetype PKCS12 \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Redesign, O=Personal, C=US"
          fi
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          {
            echo "KS_FILE=$KS_FILE"
            echo "KS_PASS=$KS_PASS"
            echo "KS_ALIAS=$KS_ALIAS"
            echo "KEY_PASS=$KEY_PASS"
          } >> $GITHUB_ENV

      - name: Build universal APK (Play Store flavor)
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$KS_FILE" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: List built APKs
        run: find V2rayNG/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: universal-apk
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk
          if-no-files-found: error
          retention-days: 30
